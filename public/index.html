<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="dark light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Astral Packager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Local identity packaging</p>
      <h1>Astral Packager</h1>
      <p>Encrypt a JSON astral profile into a portable <code>.astral</code> identity container. The file and password stay on this device.</p>
    </header>

    <form id="pack">
      <label>
        Raw profile
        <input id="file" type="file" accept=".astral,.raw,.json,application/json" required>
      </label>

      <label>
        Secure password
        <span class="pwd-field">
          <input id="password" type="password" minlength="10" maxlength="1024" autocomplete="new-password" aria-describedby="pwd-tips" required>
          <button id="password-reveal" class="reveal" type="button" aria-label="Reveal password" aria-pressed="false">
            <svg class="eye eye-closed" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 3l18 18"></path>
              <path d="M10.6 10.7A2 2 0 0 0 13.3 13.4"></path>
              <path d="M9.9 4.3A10.8 10.8 0 0 1 12 4c6.5 0 10 8 10 8a16 16 0 0 1-3 4.2"></path>
              <path d="M6.6 6.6C3.7 8.5 2 12 2 12s3.5 8 10 8c1.5 0 2.8-.4 4-1"></path>
            </svg>
            <svg class="eye eye-open" viewBox="0 0 24 24" aria-hidden="true" hidden>
              <path d="M2 12s3.5-8 10-8 10 8 10 8-3.5 8-10 8S2 12 2 12Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </span>
      </label>

      <label id="confirm-row">
        Repeat password
        <span class="pwd-field">
          <input id="confirm" type="password" minlength="10" maxlength="1024" autocomplete="new-password" aria-describedby="confirm-error" required>
          <button id="confirm-reveal" class="reveal" type="button" aria-label="Reveal password" aria-pressed="false">
            <svg class="eye eye-closed" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 3l18 18"></path>
              <path d="M10.6 10.7A2 2 0 0 0 13.3 13.4"></path>
              <path d="M9.9 4.3A10.8 10.8 0 0 1 12 4c6.5 0 10 8 10 8a16 16 0 0 1-3 4.2"></path>
              <path d="M6.6 6.6C3.7 8.5 2 12 2 12s3.5 8 10 8c1.5 0 2.8-.4 4-1"></path>
            </svg>
            <svg class="eye eye-open" viewBox="0 0 24 24" aria-hidden="true" hidden>
              <path d="M2 12s3.5-8 10-8 10 8 10 8-3.5 8-10 8S2 12 2 12Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </span>
        <small id="confirm-error" class="field-error" role="alert" hidden>Passwords do not match.</small>
      </label>

      <section id="pwd-audit" class="pwd-audit" data-score="0" aria-live="polite">
        <div class="pwd-head">
          <strong>Password strength</strong>
          <span id="pwd-score">Not scored</span>
        </div>
        <meter id="pwd-meter" min="0" max="4" value="0">0 out of 4</meter>
        <ul id="pwd-tips"></ul>
      </section>

      <button id="make" type="submit">Create encrypted container</button>

      <section id="job" class="job" aria-busy="false" hidden>
        <div class="job-head">
          <strong id="job-stage" role="status" aria-live="polite">Preparing</strong>
          <span id="job-pct">0%</span>
        </div>
        <progress id="job-bar" max="100" value="0">0%</progress>
        <div class="job-time">
          <span id="job-elapsed">Elapsed 0.0s</span>
          <span id="job-eta">ETA —</span>
        </div>
      </section>
    </form>

    <p id="status" role="status" aria-live="polite">Ready.</p>

    <section id="result" hidden>
      <label>
        Public Ed25519 key
        <input id="public-key" type="text" readonly>
      </label>
      <a id="download" class="download" href="#" download>Download .astral</a>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
